[package]
name = "krabka-client-streams"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "KIP-1071 Kafka Streams rebalance-protocol client for Apache Kafka in Rust"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/krabka-client-streams"
readme = "README.md"
keywords = ["kafka", "streams", "client", "krabka"]
categories = ["api-bindings", "network-programming"]

[lints]
workspace = true

# The crate builds for two kinds of target. The website playground compiles
# the topology, processor, DSL and store layers for the browser
# (`wasm32-unknown-unknown`), where it drives a task's processor graph through
# `EmbeddedTask` with bytes from simulated brokers. The membership and runtime
# layers are Kafka network clients, and they stay native: the client crates
# need sockets, DNS and TLS, `turso` is a native database engine,
# `krabka-schema-serde` spawns a `reqwest` future that is not `Send` on wasm,
# and tokio refuses `rt-multi-thread` on wasm. The dependencies below are the
# ones both targets share; the two `[target.*]` tables hold the split.
[dependencies]
krabka-protocol = { version = "0.5.0", default-features = false }
krabka-units = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
bytes = { workspace = true }
refined_type = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
pollster = "1.0"

# Columnar / dataframe support (opt-in via the `arrow`, `columnar`, and
# `polars` cargo features).
polars = { workspace = true, optional = true }
polars-arrow = { workspace = true, optional = true }
arrow = { workspace = true, optional = true }
columnar = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Schema-registry serdes (Avro/Protobuf/JSON) are a first-class, always-on part
# of the streams client — no feature gate.
krabka-schema-serde = { version = "0.4.1", features = ["avro", "protobuf", "json"] }
krabka-client-core = { version = "0.5.0" }
krabka-client-consumer = { version = "0.5.0" }
krabka-client-producer = { version = "0.5.0" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
# The member and process ids of a streams group member are v4 UUIDs.
uuid = { workspace = true }
turso = "0.7"

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[features]
arrow = ["dep:arrow", "dep:serde_json"]
columnar = ["dep:columnar"]
polars = ["dep:polars", "dep:polars-arrow", "dep:serde_json"]

[[example]]
name = "dataframe_serde"
required-features = ["polars"]

[[example]]
name = "polars_pipeline"
required-features = ["polars"]

[[example]]
name = "format_json"

[[example]]
name = "format_arrow"
required-features = ["arrow"]

[[example]]
name = "format_dsl"

[[example]]
name = "format_pipeline"
required-features = ["polars", "arrow"]

[dev-dependencies]
assert2 = { workspace = true }
apache-avro = { workspace = true, features = ["derive"] }
krabka-broker = { version = "0.7.0", features = ["test-helpers"] }
# Dev-only path dependency. Keep the crates.io requirement on the released
# minor line so `cargo publish` can package this crate even when release-plz
# publishes dev-dependency-only workspace crates later in the same run.
krabka-client-admin = { version = "0.5.0" }
# The in-process Schema Registry that the `format_pipeline` example boots. The
# crate is not published, so it has no crates.io version. It comes from the
# same revision as the `krabka-schema-serde` patch in the workspace manifest.
# `cargo publish` drops a dev dependency that has no version.
krabka-schema-registry = { git = "https://github.com/krabka-io/krabka-schema-registry", rev = "a7b5964f7536b07a36a1f440d4af65c0bf6609dd" }
hex = { workspace = true }
mutants = { workspace = true }
prost = { workspace = true }
prost-reflect = { workspace = true, features = ["derive"] }
proptest = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
