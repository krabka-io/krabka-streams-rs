[workspace]
resolver = "2"
members = ["crates/*"]
# The cargo-mutants pin that Bazel builds //tools/mutants from is not a member.
exclude = ["tools/mutants"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
authors = ["The Krabka Authors"]
rust-version = "1.97.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# These three opt-outs are intentional while the public API is still pre-1.0;
# re-evaluate once API surfaces stabilise.
clone_on_copy = "warn"

[profile.mutants]
inherits = "test"
debug = "none"

[profile.dev]
# Split debug info into a separate file (reduces linker work)
split-debuginfo = "packed"

[workspace.dependencies]
# Schema Registry (krabka-schema-registry) — schema parsing + canonical form.
apache-avro = "0.21"
arrow = { version = "59", default-features = false, features = ["ipc"] }
# Expressive test assertions: `assert!(a == b)` / `check!(..)` with
# captured-expression diagnostics. Used for all test assertions workspace-wide.
assert2 = "0.4"
async-trait = "0.1"
bon = "3"
bytes = "1"
columnar = "0.13"
hex = "0.4"
jsonschema = { version = "0.49", default-features = false }
# mutants: `#[cfg_attr(test, mutants::skip)]` attribute for cargo-mutants. Used
# only where `exclude_re` cannot reliably suppress a mutant (struct-field-deletion
# mutants on a live-IO adapter). Dev-dependency only; expands to nothing.
mutants = "0.0.4"
# Columnar / dataframe support for the streams client (opt-in via crate
# features). `polars` and `polars-arrow` MUST share the same version.
polars = { version = "=0.55.2", default-features = false, features = ["lazy", "ipc", "dtype-full", "parquet", "strings", "json"] }
polars-arrow = { version = "=0.55.2", default-features = false }
proptest = "1"
prost = "0.14"
prost-reflect = "0.16"
refined_type = "0.6"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# First-party crates inherited by more than one member.
krabka-units = "0.4.0"

# Sibling repositories, pinned by revision. These crates are declared
# against crates.io above and in the member manifests; the patch below is
# the single place a sibling revision is bumped.
#
# Every crate each sibling publishes is listed, not only the ones this
# repo names directly: cargo ignores a dependency's own patch table, so a
# crate reached transitively would otherwise come from the registry while
# its git twin is also in the graph.
[patch.crates-io]
krabka-audit = { git = "https://github.com/krabka-io/krabka-broker", rev = "a4c9fe3086c51f7fb09f728b35166643441292be" }
krabka-authz = { git = "https://github.com/krabka-io/krabka-broker", rev = "a4c9fe3086c51f7fb09f728b35166643441292be" }
krabka-broker = { git = "https://github.com/krabka-io/krabka-broker", rev = "a4c9fe3086c51f7fb09f728b35166643441292be" }
krabka-kraft-core = { git = "https://github.com/krabka-io/krabka-broker", rev = "a4c9fe3086c51f7fb09f728b35166643441292be" }
krabka-log = { git = "https://github.com/krabka-io/krabka-broker", rev = "a4c9fe3086c51f7fb09f728b35166643441292be" }
krabka-logfmt = { git = "https://github.com/krabka-io/krabka-broker", rev = "a4c9fe3086c51f7fb09f728b35166643441292be" }
krabka-object-store = { git = "https://github.com/krabka-io/krabka-broker", rev = "a4c9fe3086c51f7fb09f728b35166643441292be" }
krabka-raft = { git = "https://github.com/krabka-io/krabka-broker", rev = "a4c9fe3086c51f7fb09f728b35166643441292be" }
krabka-records-legacy = { git = "https://github.com/krabka-io/krabka-broker", rev = "a4c9fe3086c51f7fb09f728b35166643441292be" }
krabka-remote-storage = { git = "https://github.com/krabka-io/krabka-broker", rev = "a4c9fe3086c51f7fb09f728b35166643441292be" }
krabka-remote-storage-topic = { git = "https://github.com/krabka-io/krabka-broker", rev = "a4c9fe3086c51f7fb09f728b35166643441292be" }
krabka-telemetry = { git = "https://github.com/krabka-io/krabka-broker", rev = "a4c9fe3086c51f7fb09f728b35166643441292be" }
krabka-throttle = { git = "https://github.com/krabka-io/krabka-broker", rev = "a4c9fe3086c51f7fb09f728b35166643441292be" }
krabka-verified = { git = "https://github.com/krabka-io/krabka-broker", rev = "a4c9fe3086c51f7fb09f728b35166643441292be" }
# `krabka-broker` depends on `krabka-schema-serde`, so the git dependency above
# needs it patched here too. Resolved from krabka-schema-registry, the same
# source the broker itself patches, so the broker gets the copy it was built
# against. Note this workspace also vendors a `krabka-schema-serde` member;
# the two have diverged and should be reconciled separately.
krabka-schema-serde = { git = "https://github.com/krabka-io/krabka-schema-registry", rev = "ee9c3933fb1d71735846e7e5e33ea6ab3a694dc5" }
krabka-client-admin = { git = "https://github.com/krabka-io/krabka-client-rs", rev = "f0c86c1ccdecd1776e32349764d7d2efe5dae347" }
krabka-client-consumer = { git = "https://github.com/krabka-io/krabka-client-rs", rev = "f0c86c1ccdecd1776e32349764d7d2efe5dae347" }
krabka-client-core = { git = "https://github.com/krabka-io/krabka-client-rs", rev = "f0c86c1ccdecd1776e32349764d7d2efe5dae347" }
krabka-client-producer = { git = "https://github.com/krabka-io/krabka-client-rs", rev = "f0c86c1ccdecd1776e32349764d7d2efe5dae347" }
krabka-compression = { git = "https://github.com/krabka-io/krabka-protocol", rev = "9b63d2e96e72ca336809bf414b42cfc1f1bed017" }
krabka-ids = { git = "https://github.com/krabka-io/krabka-protocol", rev = "9b63d2e96e72ca336809bf414b42cfc1f1bed017" }
krabka-metadata = { git = "https://github.com/krabka-io/krabka-protocol", rev = "9b63d2e96e72ca336809bf414b42cfc1f1bed017" }
krabka-protocol = { git = "https://github.com/krabka-io/krabka-protocol", rev = "9b63d2e96e72ca336809bf414b42cfc1f1bed017" }
krabka-security = { git = "https://github.com/krabka-io/krabka-protocol", rev = "9b63d2e96e72ca336809bf414b42cfc1f1bed017" }
krabka-trace-context = { git = "https://github.com/krabka-io/krabka-protocol", rev = "9b63d2e96e72ca336809bf414b42cfc1f1bed017" }
krabka-units = { git = "https://github.com/krabka-io/krabka-protocol", rev = "9b63d2e96e72ca336809bf414b42cfc1f1bed017" }
krabka-voters = { git = "https://github.com/krabka-io/krabka-protocol", rev = "9b63d2e96e72ca336809bf414b42cfc1f1bed017" }
